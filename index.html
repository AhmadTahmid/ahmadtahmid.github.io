<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dota 2 Stats Tracker</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600&family=Space+Mono:ital@0;1&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="dota2.css">
    <!-- Chart.js for beautiful visualizations -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script data-goatcounter="https://shalcueva.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>

<body>
    <div class="container">
        <header>
            <h1>Dota 2 Stats</h1>
        </header>

        <div class="stats-container">
            <!-- Player Overview Section -->
            <div class="player-overview">
                <div class="profile-card">
                    <div id="player-avatar">
                        <!-- Steam avatar will be loaded here -->
                    </div>
                    <div id="player-info">
                        <h2 id="player-name">Loading...</h2>
                        <p id="player-rank">Current Rank: Loading...</p>
                    </div>
                </div>
            </div>

            <!-- Quick Stats Section -->
            <div class="quick-stats">
                <div class="stat-card">
                    <h3>Win Rate</h3>
                    <p id="win-rate">Loading...</p>
                </div>
                <div class="stat-card">
                    <h3>Total Matches</h3>
                    <p id="total-matches">Loading...</p>
                </div>
                <div class="stat-card">
                    <h3>Favorite Hero</h3>
                    <p id="favorite-hero">Loading...</p>
                </div>
                <div class="stat-card">
                    <h3>Best Win Rate</h3>
                    <p id="best-winrate">Loading...</p>
                </div>
            </div>

            <!-- Performance Trends -->
            <div class="performance-section">
                <div class="chart-container">
                    <h3>Recent Performance</h3>
                    <canvas id="performance-chart"></canvas>
                </div>
            </div>

            <!-- Recent Matches -->
            <div class="recent-matches">
                <h3>Recent Matches</h3>
                <div id="matches-list">
                    <!-- Matches will be loaded here -->
                </div>
            </div>

            <!-- Hero Stats -->
            <div class="hero-stats">
                <h3>Top Heroes</h3>
                <div id="hero-stats-grid">
                    <!-- Hero stats will be loaded here -->
                </div>
            </div>
        </div>
    </div>

    <script src="dota2.js"></script>
</body>

</html>
